<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="musL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#musL)"/>
  
  <!-- Minimalist Equalizer Audio Lines -->
  <g transform="translate(120, 180)">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="-50" x2="25" y2="50" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="-75" x2="50" y2="75" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="75" y1="-35" x2="75" y2="35" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="-90" x2="100" y2="90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="125" y1="-60" x2="125" y2="60" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
    <line x1="150" y1="-100" x2="150" y2="100" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="175" y1="-65" x2="175" y2="65" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
    <line x1="200" y1="-110" x2="200" y2="110" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="225" y1="-80" x2="225" y2="80" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
    <line x1="250" y1="-95" x2="250" y2="95" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="275" y1="-45" x2="275" y2="45" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <line x1="300" y1="-70" x2="300" y2="70" stroke="#a1a1aa" stroke-width="4" stroke-linecap="round" />
    <line x1="325" y1="-30" x2="325" y2="30" stroke="#71717a" stroke-width="4" stroke-linecap="round" />
    <line x1="350" y1="-15" x2="350" y2="15" stroke="#3f3f46" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="300" y="325" font-family="'Syne', 'Alexandria', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEXUS AUDIO // HI-RES DISCORD BOT</text>
</svg>
