<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="deepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="60%" stop-color="#050608" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="500" height="650" fill="url(#deepVoid)" />

  <!-- Subtle Geometric Grid & Orbit Rings -->
  <circle cx="250" cy="270" r="180" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <circle cx="250" cy="270" r="140" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="6 8" />
  <circle cx="250" cy="270" r="90" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- High-End Editorial Dark Coder Silhouette -->
  <!-- Coat Shoulders -->
  <path d="M 50 650 C 90 530, 140 470, 250 470 C 360 470, 410 530, 450 650 Z" fill="#08090d" stroke="url(#glassEdge)" stroke-width="1.5" />
  
  <!-- Sleek Collar Details -->
  <path d="M 170 650 L 220 480 L 250 540 L 280 480 L 330 650 Z" fill="#0f1118" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Head / Minimalist Dark Mask Base -->
  <ellipse cx="250" cy="260" rx="90" ry="115" fill="#0a0c12" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  
  <!-- Minimalist Cyber Visor Strip -->
  <rect x="175" y="240" width="150" height="24" rx="6" fill="#000000" stroke="#ffffff" stroke-width="1.5" filter="url(#softGlow)" />
  <circle cx="205" cy="252" r="3" fill="#ffffff" />
  <circle cx="295" cy="252" r="3" fill="#ffffff" />
  <text x="250" y="256" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">DARK</text>

  <!-- Sleek Studio Headphones -->
  <path d="M 150 250 C 150 140, 350 140, 350 250" fill="none" stroke="#27272a" stroke-width="10" stroke-linecap="round" />
  <rect x="140" y="225" width="22" height="60" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <rect x="338" y="225" width="22" height="60" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Typography Monogram Overlay -->
  <text x="250" y="605" font-family="'Syne', 'Alexandria', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="8">DARK // دارك</text>
  <text x="250" y="628" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a" text-anchor="middle" letter-spacing="3">SOFTWARE ARCHITECT &amp; GAME DEV</text>
</svg>
