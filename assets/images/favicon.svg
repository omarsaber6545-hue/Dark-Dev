<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Premium Chrome Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>

    <!-- Deep Obsidian Shadow -->
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="100" height="100" rx="28" fill="#000000" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Iconic Bold Geometric 'O' / DARK Emblem -->
  <g filter="url(#darkGlow)">
    <!-- Outer Heavy Ring -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Cyberpunk Sharp Slashes (giving it a badass distinctive gaming/stealth look) -->
    <line x1="28" y1="28" x2="72" y2="72" stroke="#000000" stroke-width="4" />
    
    <!-- Central Obsidian Core Dot -->
    <circle cx="50" cy="50" r="8" fill="#ffffff" />
  </g>
</svg>
