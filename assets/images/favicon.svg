<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090b12" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#favGrad)" stroke-width="3" />
  <text x="50" y="62" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="34" fill="url(#favGrad)" text-anchor="middle" filter="url(#glow)">&lt;/&gt;</text>
</svg>
