<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Obsidian Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e14" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Luxury Titanium Silver Text Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Subtle Premium Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Rounded Card -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="95" height="95" rx="23.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- OMAR Monogram / Wordmark -->
  <g filter="url(#glow)">
    <text x="50" y="61" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Space Grotesk', sans-serif" 
          font-weight="900" 
          font-size="27" 
          letter-spacing="1.5" 
          fill="url(#silverGrad)" 
          text-anchor="middle">OMAR</text>
  </g>

  <!-- Premium Accent Dot -->
  <circle cx="82" cy="38" r="3.5" fill="#ffffff" opacity="0.9" />
</svg>
