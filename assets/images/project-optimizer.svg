<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="optL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#optL)"/>
  
  <!-- CPU Core in Center -->
  <rect x="235" y="85" width="130" height="130" rx="16" fill="#06070a" stroke="#ffffff" stroke-width="2" />
  <rect x="260" y="110" width="80" height="80" rx="8" fill="#11131a" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="300" y="155" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">CPU LOW-LAG</text>
  <text x="300" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" text-anchor="middle">0.05ms POLLING</text>

  <!-- Metric Circles Left & Right -->
  <circle cx="110" cy="150" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <path d="M 80 150 A 30 30 0 1 1 140 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <text x="110" y="155" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">FPS +45%</text>

  <circle cx="490" cy="150" r="45" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <path d="M 460 150 A 30 30 0 1 1 520 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <text x="490" y="155" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RAM -55%</text>

  <text x="300" y="315" font-family="'Syne', 'Alexandria', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">DARKOPTIMIZER // WINDOWS UTILITY</text>
</svg>
